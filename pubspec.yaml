name: fintracker
description: A Flutter finance tracker demo rebuilt for Windows and Web without a database.
publish_to: 'none'
version: 1.0.1+3

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  intl: ^0.20.2
  firebase_core: ^2.17.0
  firebase_auth: ^4.8.0
  cloud_firestore: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
